<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GridTalk — World Pixel Board</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 5px 0; font-size: 24px; text-align: center; }

    /* Зал славы */
    .hall-of-fame {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      padding: 10px 15px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
      box-sizing: border-box;
      text-align: center;
    }
    .hall-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .hall-leader { font-size: 13px; opacity: 0.9; }

    /* Полоса захвата */
    .team-bar {
      display: flex;
      width: 100%;
      max-width: 400px;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      background: #334155;
    }
    .team-segment { height: 100%; transition: width 0.3s ease; }

    /* Управление */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
    }
    .energy-badge { font-weight: bold; color: #facc15; }
    .btn-ad {
      background: #22c55e;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Сетка */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: #334155;
      padding: 6px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .cell {
      background: #1e293b;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transition: transform 0.1s;
    }
    .cell:active { transform: scale(0.95); }
    .cell.locked::after { content: '🔒'; position: absolute; font-size: 10px; }

    /* Модальные окна */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, select, textarea {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-family: inherit;
    }
    .btn-submit {
      background: var(--accent);
      border: none;
      color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>👑 GridTalk World</h1>

  <!-- Зал славы -->
  <div class="hall-of-fame">
    <div class="hall-title">🏆 Топ-Лидер Недели</div>
    <div class="hall-leader" id="topLeader">Загрузка лидера...</div>
  </div>

  <!-- Статистика команд -->
  <div class="team-bar" id="teamBar">
    <div class="team-segment" style="width: 20%; background: #ef4444;"></div>
    <div class="team-segment" style="width: 20%; background: #3b82f6;"></div>
    <div class="team-segment" style="width: 20%; background: #22c55e;"></div>
    <div class="team-segment" style="width: 20%; background: #a855f7;"></div>
    <div class="team-segment" style="width: 20%; background: #f97316;"></div>
  </div>

  <!-- Панель энергии -->
  <div class="controls">
    <span>Энергия: <span class="energy-badge" id="energyCount">3</span> ⚡</span>
    <button class="btn-ad" id="adBtn" onclick="watchAd()">+2 ⚡ (Реклама)</button>
  </div>

  <!-- Игровое поле -->
  <div class="grid-container" id="grid"></div>

  <!-- Модальное окно редактора/просмотра -->
  <div class="modal" id="cellModal">
    <div class="modal-content">
      <h3 id="modalTitle">Ячейка #0</h3>
      <div id="viewMode">
        <p id="cellAuthor">Автор: -</p>
        <p id="cellText">Сообщение: -</p>
        <p>❤️ Лайков: <span id="likeCount">0</span></p>
        <button class="btn-submit" onclick="likeCell()">❤️ Поддержать</button>
        <button class="btn-submit" style="background:#475569; margin-top:5px;" onclick="enableEdit()">Перекрасить</button>
      </div>

      <div id="editMode" style="display:none;">
        <label>Команда (Цвет):</label>
        <select id="teamColor">
          <option value="#ef4444">🔴 Красные</option>
          <option value="#3b82f6">🔵 Синие</option>
          <option value="#22c55e">🟢 Зеленые</option>
          <option value="#a855f7">🟣 Фиолетовые</option>
          <option value="#f97316">🟠 Оранжевые</option>
        </select>
        <input type="text" id="authorInput" placeholder="Твой ник / @channel" maxlength="20" />
        <textarea id="textInput" placeholder="Текст или ссылка" rows="2" maxlength="50"></textarea>
        <label><input type="checkbox" id="lockCheck" /> 🔒 Защита 24ч (3 ⚡)</label>
        <button class="btn-submit" onclick="saveCell()">Сохранить (1 ⚡)</button>
      </div>
      <button style="background:transparent; border:none; color:#94a3b8; cursor:pointer;" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Инициализация Firebase (Данные твоего проекта)
    const firebaseConfig = {
      databaseURL: "https://gridtalk-default-rtdb.firebaseio.com/" // Укажи свой URL Firebase
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let energy = 3;
    let selectedIndex = null;
    let gridData = {};

    // Отрисовка сетки
    const grid = document.getElementById('grid');
    for (let i = 0; i < 64; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.onclick = () => openModal(i);
      grid.appendChild(cell);
    }

    // Загрузка данных в реальном времени
    onValue(ref(db, 'board/'), (snapshot) => {
      gridData = snapshot.val() || {};
      updateGrid();
      updateHallOfFame();
    });

    function updateGrid() {
      document.querySelectorAll('.cell').forEach((cell, i) => {
        const data = gridData[i];
        if (data) {
          cell.style.background = data.color || '#1e293b';
          cell.innerText = data.likes ? `❤️${data.likes}` : '';
          cell.classList.toggle('locked', Boolean(data.lockUntil && data.lockUntil > Date.now()));
        } else {
          cell.style.background = '#1e293b';
          cell.innerText = '';
        }
      });
    }

    function updateHallOfFame() {
      let maxLikes = -1;
      let topUser = "Пока нет лидера";
      Object.values(gridData).forEach(cell => {
        if (cell.likes && cell.likes > maxLikes) {
          maxLikes = cell.likes;
          topUser = `${cell.author || 'Аноним'}: "${cell.text}" (${cell.likes} ❤️)`;
        }
      });
      document.getElementById('topLeader').innerText = topUser;
    }

    window.openModal = (i) => {
      selectedIndex = i;
      const data = gridData[i] || {};
      document.getElementById('modalTitle').innerText = `Ячейка #${i + 1}`;
      document.getElementById('cellAuthor').innerText = `Автор: ${data.author || 'Свободно'}`;
      document.getElementById('cellText').innerText = `Сообщение: ${data.text || 'Нет текста'}`;
      document.getElementById('likeCount').innerText = data.likes || 0;
      
      document.getElementById('viewMode').style.display = 'block';
      document.getElementById('editMode').style.display = 'none';
      document.getElementById('cellModal').style.display = 'flex';
    };

    window.enableEdit = () => {
      const data = gridData[selectedIndex] || {};
      if (data.lockUntil && data.lockUntil > Date.now()) {
        alert("🔒 Эта ячейка защищена замком!");
        return;
      }
      document.getElementById('viewMode').style.display = 'none';
      document.getElementById('editMode').style.display = 'block';
    };

    window.saveCell = () => {
      const isLocked = document.getElementById('lockCheck').checked;
      const cost = isLocked ? 3 : 1;

      if (energy < cost) {
        alert(`Недостаточно энергии! Нужно ${cost} ⚡`);
        return;
      }

      energy -= cost;
      document.getElementById('energyCount').innerText = energy;

      const updateData = {
        color: document.getElementById('teamColor').value,
        author: document.getElementById('authorInput').value || 'Аноним',
        text: document.getElementById('textInput').value || '',
        likes: (gridData[selectedIndex]?.likes || 0),
        lockUntil: isLocked ? Date.now() + 86400000 : null
      };

      set(ref(db, `board/${selectedIndex}`), updateData);
      closeModal();
    };

    window.likeCell = () => {
      if (!gridData[selectedIndex]) return;
      const currentLikes = (gridData[selectedIndex].likes || 0) + 1;
      update(ref(db, `board/${selectedIndex}`), { likes: currentLikes });
      document.getElementById('likeCount').innerText = currentLikes;
    };

    window.closeModal = () => {
      document.getElementById('cellModal').style.display = 'none';
    };

    window.watchAd = () => {
      // Имитация просмотра рекламы (универсальный фоллбек)
      alert("Просмотр рекламы...");
      energy += 2;
      document.getElementById('energyCount').innerText = energy;
    };
  </script>
</body>
</html>
