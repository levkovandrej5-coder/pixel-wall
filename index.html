<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridTalk</title>.
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { background-color: #121824; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    .header { display: flex; justify-content: space-between; width: 100%; max-width: 360px; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; max-width: 360px; margin-top: 20px; }
    .cell { background: #232d3f; aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #6b7c96; cursor: pointer; }
    .cell.active { background: #0088cc; color: #fff; font-size: 18px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    .modal-content { background: #1e2738; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; text-align: center; }
    input { width: 90%; padding: 8px; margin: 10px 0; border-radius: 6px; border: none; }
    button { padding: 8px 16px; border-radius: 6px; border: none; background: #0088cc; color: #fff; cursor: pointer; margin: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>GridTalk</h2>.
    <div id="energy">⚡ 3/3</div>
  </div>
  
  <div class="grid" id="grid"></div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBbdpmxT302xtIkeX",
      authDomain: "impulse-pn3unk-f885b.firebaseapp.com",
      databaseURL: "https://impulse-pn3unk-f885b-default-rtdb.firebaseio.com",
      projectId: "impulse-pn3unk-f885b",
      storageBucket: "impulse-pn3unk-f885b.appspot.com",
      messagingSenderId: "593460602073",
      appId: "1:593460602073:web:b8f3e18c8eb29c0fe2cac8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const grid = document.getElementById('grid');
    let selectedCell = null;

    for (let i = 1; i <= 36; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${i}`;
      cell.innerText = i;
      cell.onclick = () => clickCell(i);
      grid.appendChild(cell);
    }

    db.ref('pixels').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      for (let i = 1; i <= 36; i++) {
        const cell = document.getElementById(`cell-${i}`);
        if (data[i]) {
          cell.classList.add('active');
          cell.innerText = '📌';
        } else {
          cell.classList.remove('active');
          cell.innerText = i;
        }
      }
    });

    function clickCell(id) {
      selectedCell = id;
      db.ref('pixels/' + id).once('value', (snapshot) => {
        const val = snapshot.val();
        const modal = document.getElementById('modal');
        const content = document.getElementById('modalContent');
        modal.style.display = 'flex';
        
        if (val) {
          content.innerHTML = `<h3>Ячейка #${id}</h3><p>${val}</p><button onclick="closeModal()">Закрыть</button>`;
        } else {
          content.innerHTML = `<h3>Занять ячейку #${id}</h3><input id="noteInput" placeholder="Ваша записка..." maxlength="50"><br><button onclick="saveNote()">Сохранить</button> <button onclick="closeModal()">Отмена</button>`;
        }
      });
    }

    function saveNote() {
      const text = document.getElementById('noteInput').value;
      if (text) {
        db.ref('pixels/' + selectedCell).set(text);
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
