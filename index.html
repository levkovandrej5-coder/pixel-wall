<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridTalk</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 16px; user-select: none; -webkit-user-select: none; }
    .header { display: flex; justify-content: space-between; width: 100%; max-width: 380px; align-items: center; margin-bottom: 10px; }
    .header h2 { margin: 0; font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .energy-badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }

    .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; width: 100%; max-width: 380px; margin-top: 10px; }
    .cell { background: #1e293b; aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
    .cell:active { transform: scale(0.92); }
    .cell.active { color: #fff; font-size: 14px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .cell.color-blue { background: linear-gradient(135deg, #0284c7, #38bdf8); }
    .cell.color-green { background: linear-gradient(135deg, #16a34a, #4ade80); }
    .cell.color-purple { background: linear-gradient(135deg, #9333ea, #c084fc); }
    .cell.color-orange { background: linear-gradient(135deg, #ea580c, #fb923c); }
    .cell.color-pink { background: linear-gradient(135deg, #db2777, #f472b6); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 16px; width: 85%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-content h3 { margin-top: 0; margin-bottom: 8px; font-size: 18px; color: #f1f5f9; }
    .author-tag { font-size: 12px; color: #38bdf8; margin-bottom: 12px; font-weight: 600; }
    .modal-content p { color: #cbd5e1; word-break: break-word; font-size: 15px; margin-bottom: 20px; }

    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }

    .color-picker { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
    .color-opt.selected { border-color: #fff; transform: scale(1.15); }

    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    button { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    button.btn-danger { background: #ef4444; color: #fff; }
    button.btn-secondary { background: #334155; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="header">
    <h2>GridTalk</h2>
    <div class="energy-badge" id="energy">⚡ 3/3</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const firebaseConfig = {
      databaseURL: "https://gridtalk-df1c1-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let energy = localStorage.getItem('gt_energy') !== null ? parseInt(localStorage.getItem('gt_energy')) : 3;
    let selectedCell = null;
    let selectedColor = 'blue';
    const userName = tg.initDataUnsafe?.user?.first_name || 'Аноним';

    function updateEnergyUI() {
      document.getElementById('energy').innerText = `⚡ ${energy}/3`;
    }
    updateEnergyUI();

    const grid = document.getElementById('grid');
    for (let i = 0; i < 64; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${i}`;
      cell.innerText = i + 1;
      cell.onclick = () => handleCellClick(i);
      grid.appendChild(cell);
    }

    db.ref('pixels').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      for (let i = 0; i < 64; i++) {
        const cellEl = document.getElementById(`cell-${i}`);
        cellEl.className = 'cell';
        if (data[i]) {
          cellEl.classList.add('active', `color-${data[i].color}`);
          cellEl.innerText = data[i].text ? '💬' : '★';
        } else {
          cellEl.innerText = i + 1;
        }
      }
    });

    function handleCellClick(index) {
      selectedCell = index;
      const modal = document.getElementById('modal');
      const content = document.getElementById('modalContent');
      
            if (energy <= 0) {
        content.innerHTML = `
          <h3>Закончилась энергия!</h3>
          <p>Посмотрите короткую рекламу, чтобы получить +1 ⚡ энергии.</p>
          <div class="btn-group">
            <button onclick="watchAdForEnergy()">Смотреть рекламу (+1 ⚡)</button>
            <button class="btn-secondary" onclick="closeModal()">Закрыть</button>
          </div>
        `;
      } else {
        content.innerHTML = `
          <h3>Ячейка #${index + 1}</h3>
          <input type="text" id="noteInput" placeholder="Оставьте сообщение..." maxlength="60">
          <div class="color-picker">
            <div class="color-opt selected" style="background:#0284c7" onclick="selectColor('blue', this)"></div>
            <div class="color-opt" style="background:#16a34a" onclick="selectColor('green', this)"></div>
            <div class="color-opt" style="background:#9333ea" onclick="selectColor('purple', this)"></div>
            <div class="color-opt" style="background:#ea580c" onclick="selectColor('orange', this)"></div>
            <div class="color-opt" style="background:#db2777" onclick="selectColor('pink', this)"></div>
          </div>
          <div class="btn-group">
            <button onclick="saveNote()">Опубликовать (-1 ⚡)</button>
            <button class="btn-secondary" onclick="closeModal()">Отмена</button>
          </div>
        `;
      }
      modal.style.display = 'flex';


    }

    function selectColor(color, el) {
      selectedColor = color;
      document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function saveNote() {
      const text = document.getElementById('noteInput').value;
      if (text && energy > 0) {
        db.ref('pixels/' + selectedCell).set({
          text: text,
          color: selectedColor,
          author: userName
        });
        energy--;
        localStorage.setItem('gt_energy', energy);
        updateEnergyUI();
        closeModal();
      }
    }

    function deleteNote() {
      db.ref('pixels/' + selectedCell).remove();
      closeModal();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    const AdController = window.Adsgram.init({ blockId: "47551" });

    function watchAdForEnergy() {
      AdController.show().then((result) => {
        energy += 1;
        localStorage.setItem('gt_energy', energy);
        updateEnergyUI();
        closeModal();
        alert("Вы получили +1 энергия!");
      }).catch((result) => {
        console.log("Реклама не досмотрена", result);
      });
    }
  </script>
</body>
</html>
